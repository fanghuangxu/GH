<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古典诗句问答</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink-black: #2c2c2c;
            --paper-white: #f5f0e6;
            --cinnabar-red: #c73e3a;
            --gold-accent: #b8860b;
            --light-paper: #faf8f3;
            --dark-red: #8b0000;
            --border-brown: #8b7355;
        }

        body {
            font-family: "SimSun", "宋体", "Noto Serif SC", serif;
            background: var(--ink-black);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            min-height: 600px;
            position: relative;
        }

        .screen {
            display: none;
            background: var(--paper-white);
            border-radius: 8px;
            padding: 40px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 30px,
                    rgba(139, 115, 85, 0.1) 30px,
                    rgba(139, 115, 85, 0.1) 31px
                );
            animation: fadeIn 0.6s ease-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scrollUnfold {
            from { max-height: 0; opacity: 0; }
            to { max-height: 500px; opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes correctFlash {
            0% { background-color: var(--paper-white); }
            50% { background-color: rgba(199, 62, 58, 0.2); }
            100% { background-color: var(--paper-white); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        @keyframes scoreUp {
            0% { transform: scale(1); color: var(--ink-black); }
            50% { transform: scale(1.3); color: var(--cinnabar-red); }
            100% { transform: scale(1); color: var(--ink-black); }
        }

        .ornament-border {
            position: absolute;
            border: 3px solid var(--border-brown);
            pointer-events: none;
        }

        .ornament-border.top-left {
            top: 10px;
            left: 10px;
            right: 60%;
            bottom: 60%;
            border-right: none;
            border-bottom: none;
            border-top-left-radius: 8px;
        }

        .ornament-border.bottom-right {
            top: 60%;
            left: 60%;
            right: 10px;
            bottom: 10px;
            border-left: none;
            border-top: none;
            border-bottom-right-radius: 8px;
        }

        .corner-decoration {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--cinnabar-red);
        }

        .corner-decoration.tl { top: 5px; left: 5px; border-right: none; border-bottom: none; }
        .corner-decoration.tr { top: 5px; right: 5px; border-left: none; border-bottom: none; }
        .corner-decoration.bl { bottom: 5px; left: 5px; border-right: none; border-top: none; }
        .corner-decoration.br { bottom: 5px; right: 5px; border-left: none; border-top: none; }

        h1 {
            text-align: center;
            color: var(--ink-black);
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            letter-spacing: 0.2em;
        }

        h2 {
            text-align: center;
            color: var(--ink-black);
            font-size: 1.8em;
            margin-bottom: 20px;
            letter-spacing: 0.15em;
        }

        .subtitle {
            text-align: center;
            color: var(--border-brown);
            font-size: 1.1em;
            margin-bottom: 40px;
            font-style: italic;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 280px;
            margin: 15px auto;
            padding: 15px 30px;
            font-size: 1.2em;
            font-family: inherit;
            color: var(--paper-white);
            background: var(--cinnabar-red);
            border: 2px solid var(--dark-red);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.1em;
        }

        .btn:hover {
            background: var(--dark-red);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--border-brown);
            border-color: #6b5344;
        }

        .btn-secondary:hover {
            background: #6b5344;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
            max-width: 150px;
        }

        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 12px 25px;
            font-size: 1.1em;
            border: 2px solid var(--border-brown);
            background: var(--paper-white);
            color: var(--ink-black);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .difficulty-btn:hover {
            border-color: var(--cinnabar-red);
            color: var(--cinnabar-red);
        }

        .difficulty-btn.selected {
            background: var(--cinnabar-red);
            color: var(--paper-white);
            border-color: var(--cinnabar-red);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(139, 115, 85, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(139, 115, 85, 0.3);
        }

        .stat-item {
            text-align: center;
            flex: 1;
            min-width: 80px;
        }

        .stat-label {
            font-size: 0.85em;
            color: var(--border-brown);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            color: var(--ink-black);
            font-weight: bold;
        }

        .stat-value.highlight {
            animation: scoreUp 0.5s ease;
        }

        .poem-scroll {
            background: linear-gradient(to bottom, #e8e0d0, var(--paper-white), #e8e0d0);
            border: 8px solid #8b7355;
            border-radius: 4px;
            padding: 40px;
            margin: 20px 0;
            position: relative;
            box-shadow: 
                inset 0 0 30px rgba(139, 115, 85, 0.2),
                0 10px 30px rgba(0, 0, 0, 0.1);
            animation: scrollUnfold 0.8s ease-out;
        }

        .poem-scroll::before,
        .poem-scroll::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 20px;
            background: linear-gradient(to bottom, #6b5344, #8b7355, #6b5344);
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .poem-scroll::before { top: -15px; }
        .poem-scroll::after { bottom: -15px; }

        .poem-content {
            font-size: 1.8em;
            text-align: center;
            color: var(--ink-black);
            line-height: 2;
            margin-bottom: 15px;
            letter-spacing: 0.15em;
        }

        .poem-question {
            text-align: center;
            font-size: 1.2em;
            color: var(--border-brown);
            margin-top: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .option-btn {
            padding: 18px 15px;
            font-size: 1.1em;
            font-family: inherit;
            background: var(--paper-white);
            border: 2px solid var(--border-brown);
            color: var(--ink-black);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 4px;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--cinnabar-red);
            color: var(--cinnabar-red);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 115, 85, 0.2);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-btn.correct {
            background: rgba(199, 62, 58, 0.2);
            border-color: var(--cinnabar-red);
            color: var(--cinnabar-red);
            animation: pulse 0.5s ease;
        }

        .option-btn.wrong {
            background: rgba(0, 0, 0, 0.05);
            border-color: #999;
            color: #999;
            animation: wrongShake 0.5s ease;
        }

        .option-btn.key-selected {
            border-color: var(--cinnabar-red);
            background: rgba(199, 62, 58, 0.15);
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(199, 62, 58, 0.4);
        }

        .btn.key-selected {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(139, 115, 85, 0.5);
        }

        .timer-bar {
            height: 6px;
            background: rgba(139, 115, 85, 0.2);
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }

        .timer-progress {
            height: 100%;
            background: linear-gradient(to right, var(--cinnabar-red), var(--gold-accent));
            border-radius: 3px;
            transition: width 0.1s linear;
        }

        .timer-text {
            text-align: center;
            font-size: 1.1em;
            color: var(--border-brown);
            margin-bottom: 10px;
        }

        .feedback {
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            font-size: 1.2em;
            display: none;
        }

        .feedback.correct {
            display: block;
            background: rgba(199, 62, 58, 0.1);
            border: 1px solid var(--cinnabar-red);
            color: var(--cinnabar-red);
            animation: correctFlash 0.5s ease;
        }

        .feedback.wrong {
            display: block;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid #999;
            color: #666;
        }

        .feedback-detail {
            font-size: 0.9em;
            margin-top: 10px;
            color: var(--border-brown);
        }

        .result-screen {
            text-align: center;
        }

        .final-score {
            font-size: 4em;
            color: var(--cinnabar-red);
            margin: 30px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .result-stat {
            text-align: center;
        }

        .result-stat-value {
            font-size: 2em;
            color: var(--ink-black);
        }

        .result-stat-label {
            font-size: 0.9em;
            color: var(--border-brown);
        }

        .leaderboard {
            margin: 30px 0;
            padding: 20px;
            background: rgba(139, 115, 85, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(139, 115, 85, 0.3);
        }

        .leaderboard h3 {
            text-align: center;
            margin-bottom: 15px;
            color: var(--ink-black);
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px dashed rgba(139, 115, 85, 0.3);
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .leaderboard-rank {
            color: var(--cinnabar-red);
            font-weight: bold;
            width: 30px;
        }

        .leaderboard-score {
            color: var(--ink-black);
            font-weight: bold;
        }

        .favorites-section {
            margin: 30px 0;
            padding: 20px;
            background: rgba(139, 115, 85, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(139, 115, 85, 0.3);
        }

        .favorites-section h3 {
            text-align: center;
            margin-bottom: 15px;
            color: var(--ink-black);
        }

        .favorite-item {
            padding: 15px;
            margin: 10px 0;
            background: var(--paper-white);
            border-radius: 4px;
            border-left: 3px solid var(--cinnabar-red);
        }

        .favorite-poem {
            font-size: 1.1em;
            color: var(--ink-black);
            margin-bottom: 5px;
        }

        .favorite-info {
            font-size: 0.85em;
            color: var(--border-brown);
        }

        .favorite-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .icon-btn {
            padding: 5px 10px;
            font-size: 0.85em;
            border: 1px solid var(--border-brown);
            background: var(--paper-white);
            color: var(--border-brown);
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            border-color: var(--cinnabar-red);
            color: var(--cinnabar-red);
        }

        .empty-message {
            text-align: center;
            color: var(--border-brown);
            font-style: italic;
            padding: 20px;
        }

        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            font-size: 1em;
            font-family: inherit;
            border: 2px solid var(--border-brown);
            background: var(--paper-white);
            color: var(--ink-black);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--cinnabar-red);
            color: var(--paper-white);
            border-color: var(--cinnabar-red);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .game-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .question-type-toggle {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .toggle-btn {
            padding: 10px 20px;
            font-size: 0.95em;
            font-family: inherit;
            border: 2px solid var(--border-brown);
            background: var(--paper-white);
            color: var(--ink-black);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: var(--border-brown);
            color: var(--paper-white);
            border-color: var(--border-brown);
        }

        .bonus-text {
            color: var(--gold-accent);
            font-size: 0.9em;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .screen {
                padding: 25px 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            h2 {
                font-size: 1.4em;
            }

            .poem-content {
                font-size: 1.4em;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            .result-stats {
                gap: 20px;
            }

            .difficulty-selector {
                gap: 10px;
            }

            .difficulty-btn {
                padding: 10px 15px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="screen active" id="startScreen">
            <div class="ornament-border top-left"></div>
            <div class="ornament-border bottom-right"></div>
            <div class="corner-decoration tl"></div>
            <div class="corner-decoration tr"></div>
            <div class="corner-decoration bl"></div>
            <div class="corner-decoration br"></div>

            <h1>古典诗句问答</h1>
            <p class="subtitle">诵千古诗词，传华夏文明</p>

            <div class="question-type-toggle">
                <button class="toggle-btn active" data-type="mixed" onclick="setQuestionType('mixed')">混合模式</button>
            </div>

            <div class="difficulty-selector">
                <button class="difficulty-btn" data-difficulty="easy" onclick="setDifficulty('easy')">简单</button>
                <button class="difficulty-btn selected" data-difficulty="medium" onclick="setDifficulty('medium')">中等</button>
                <button class="difficulty-btn" data-difficulty="hard" onclick="setDifficulty('hard')">困难</button>
            </div>

            <button class="btn" onclick="startGame()">开始答题</button>
            <button class="btn btn-secondary" onclick="showFavorites()">收藏诗句</button>
            <button class="btn btn-secondary btn-small" onclick="showLeaderboard()">排行榜</button>
        </div>

        <div class="screen" id="gameScreen">
            <div class="ornament-border top-left"></div>
            <div class="ornament-border bottom-right"></div>
            <div class="corner-decoration tl"></div>
            <div class="corner-decoration tr"></div>
            <div class="corner-decoration bl"></div>
            <div class="corner-decoration br"></div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-label">分数</div>
                    <div class="stat-value" id="scoreDisplay">0</div>
                    <div class="bonus-text" id="bonusText"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">连击</div>
                    <div class="stat-value" id="comboDisplay">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">已答</div>
                    <div class="stat-value" id="answeredDisplay">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">剩余</div>
                    <div class="stat-value" id="remainingDisplay">20</div>
                </div>
            </div>

            <div class="timer-text">剩余时间: <span id="timerDisplay">15</span>秒</div>
            <div class="timer-bar">
                <div class="timer-progress" id="timerProgress"></div>
            </div>

            <div class="poem-scroll">
                <div class="poem-content" id="poemContent"></div>
                <div class="poem-question" id="poemQuestion"></div>
            </div>

            <div class="options-grid" id="optionsGrid"></div>

            <div class="feedback" id="feedback">
                <div id="feedbackText"></div>
                <div class="feedback-detail" id="feedbackDetail"></div>
            </div>

            <div class="game-controls">
                <button class="btn btn-secondary btn-small" onclick="addToFavorites()" id="favoriteBtn">收藏此诗</button>
                <button class="btn btn-small" onclick="nextQuestion()" id="nextBtn" style="display:none;">下一题 (Enter)</button>
            </div>
        </div>

        <div class="screen" id="endScreen">
            <div class="ornament-border top-left"></div>
            <div class="ornament-border bottom-right"></div>
            <div class="corner-decoration tl"></div>
            <div class="corner-decoration tr"></div>
            <div class="corner-decoration bl"></div>
            <div class="corner-decoration br"></div>

            <div class="result-screen">
                <h2>答题结束</h2>
                <div class="final-score" id="finalScore">0</div>
                <p style="text-align:center; color: var(--border-brown);">最终得分</p>

                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-value" id="correctCount">0</div>
                        <div class="result-stat-label">答对</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="wrongCount">0</div>
                        <div class="result-stat-label">答错</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="maxCombo">0</div>
                        <div class="result-stat-label">最高连击</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="timeBonus">0</div>
                        <div class="result-stat-label">计时奖励</div>
                    </div>
                </div>

                <div class="leaderboard">
                    <h3>最高分排行榜</h3>
                    <div id="endLeaderboard"></div>
                </div>

                <button class="btn" onclick="restartGame()">再来一局</button>
                <button class="btn btn-secondary" onclick="showFavorites()">查看收藏</button>
                <button class="btn btn-secondary btn-small" onclick="goToStart()">返回主页</button>
            </div>
        </div>

        <div class="screen" id="favoritesScreen">
            <div class="ornament-border top-left"></div>
            <div class="ornament-border bottom-right"></div>
            <div class="corner-decoration tl"></div>
            <div class="corner-decoration tr"></div>
            <div class="corner-decoration bl"></div>
            <div class="corner-decoration br"></div>

            <h2>收藏的诗句</h2>

            <div id="favoritesList">
                <p class="empty-message">暂无收藏的诗句</p>
            </div>

            <button class="btn btn-secondary" onclick="goToStart()">返回主页</button>
        </div>

        <div class="screen" id="leaderboardScreen">
            <div class="ornament-border top-left"></div>
            <div class="ornament-border bottom-right"></div>
            <div class="corner-decoration tl"></div>
            <div class="corner-decoration tr"></div>
            <div class="corner-decoration bl"></div>
            <div class="corner-decoration br"></div>

            <h2>最高分排行榜</h2>

            <div class="leaderboard" id="leaderboardList">
                <div id="leaderboardContent"></div>
            </div>

            <button class="btn btn-secondary" onclick="goToStart()">返回主页</button>
        </div>
    </div>

    <script>
        let poems = [
            // 苏轼 - 饮湖上初晴后雨
            { content: "水光潋滟晴方好，山色空蒙雨亦奇", firstHalf: "水光潋滟晴方好，", secondHalf: "山色空蒙雨亦奇", author: "苏轼", title: "饮湖上初晴后雨", dynasty: "宋" },
            { content: "欲把西湖比西子，淡妆浓抹总相宜", firstHalf: "欲把西湖比西子，", secondHalf: "淡妆浓抹总相宜", author: "苏轼", title: "饮湖上初晴后雨", dynasty: "宋" },
            
            // 苏轼 - 六月二十七日望湖楼醉书

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function setDifficulty(difficulty) {
            gameState.difficulty = difficulty;
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.difficulty === difficulty);
            });
        }

        function setQuestionType(type) {
            gameState.questionType = type;
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
        }

        function handleKeyboard(event) {
            const activeScreen = document.querySelector('.screen.active');
            if (!activeScreen || activeScreen.id !== 'gameScreen') return;
            if (gameState.isAnswered) {
                if (event.key === 'Enter' && document.getElementById('nextBtn').style.display !== 'none') {
                    const nextBtn = document.getElementById('nextBtn');
                    nextBtn.classList.add('key-selected');
                    setTimeout(() => nextBtn.classList.remove('key-selected'), 150);
                    nextQuestion();
                }
                return;
            }

            const key = event.key;
            if (key >= '1' && key <= '9') {
                const index = parseInt(key) - 1;
                if (gameState.optionElements && gameState.optionElements[index]) {
                    const btn = gameState.optionElements[index];
                    btn.classList.add('key-selected');
                    setTimeout(() => btn.classList.remove('key-selected'), 150);
                    btn.click();
                }
            }
        }

        document.addEventListener('keydown', handleKeyboard);

        function startGame() {
            gameState = {
                score: 0,
                combo: 0,
                maxCombo: 0,
                answered: 0,
                totalQuestions: 20,
                correctCount: 0,
                wrongCount: 0,
                timeBonus: 0,
                difficulty: gameState.difficulty,
                questionType: gameState.questionType,
                currentQuestionType: 'author',
                currentPoem: null,
                currentOptions: [],
                timerInterval: null,
                timeLeft: timerConfig[gameState.difficulty],
                answeredPoems: [],
                isAnswered: false
            };

            updateDisplay();
            showScreen('gameScreen');
            loadQuestion();
        }

        function loadQuestion() {
            if (gameState.answered >= gameState.totalQuestions) {
                endGame();
                return;
            }

            gameState.isAnswered = false;
            const availablePoems = poems.filter(p => !gameState.answeredPoems.includes(p.content));

            if (availablePoems.length === 0) {
                gameState.answeredPoems = [];
            }

            const randomIndex = Math.floor(Math.random() * availablePoems.length);
            gameState.currentPoem = availablePoems[randomIndex];
            gameState.answeredPoems.push(gameState.currentPoem.content);

            let currentQuestionType = gameState.questionType;
            if (currentQuestionType === 'mixed') {
                const types = ['author', 'title', 'fill'];
                currentQuestionType = types[Math.floor(Math.random() * types.length)];
            }
            gameState.currentQuestionType = currentQuestionType;

            const optionCount = difficultyOptions[gameState.difficulty];
            let questionText, correctAnswer, optionPool, displayContent;

            if (currentQuestionType === 'fill') {
                questionText = '请填出下句：';
                correctAnswer = gameState.currentPoem.secondHalf;
                optionPool = fillOptions;
                displayContent = gameState.currentPoem.firstHalf + '__________';
            } else if (currentQuestionType === 'author') {
                questionText = '以上诗句的作者是？';
                correctAnswer = gameState.currentPoem.author;
                optionPool = authors;
                displayContent = gameState.currentPoem.content;
            } else {
                questionText = '以上诗句的题目是？';
                correctAnswer = gameState.currentPoem.title;
                optionPool = titles;
                displayContent = gameState.currentPoem.content;
            }

            const optionsSet = new Set([correctAnswer]);

            while (optionsSet.size < optionCount) {
                const randomOpt = optionPool[Math.floor(Math.random() * optionPool.length)];
                if (randomOpt !== correctAnswer) {
                    optionsSet.add(randomOpt);
                }
            }

            gameState.currentOptions = Array.from(optionsSet);
            shuffleArray(gameState.currentOptions);

            const poemContent = document.getElementById('poemContent');
            const poemQuestion = document.getElementById('poemQuestion');
            const optionsGrid = document.getElementById('optionsGrid');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            const favoriteBtn = document.getElementById('favoriteBtn');

            poemContent.textContent = displayContent;
            poemContent.style.animation = 'none';
            poemContent.offsetHeight;
            poemContent.style.animation = 'scrollUnfold 0.8s ease-out';

            poemQuestion.textContent = questionText;
            feedback.className = 'feedback';
            feedback.style.display = 'none';
            nextBtn.style.display = 'none';
            favoriteBtn.style.display = 'block';

            optionsGrid.innerHTML = '';
            gameState.optionElements = [];
            gameState.currentOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${option} (数字${index + 1})`;
                btn.style.animationDelay = `${index * 0.1}s`;
                btn.onclick = () => selectAnswer(option, btn);
                btn.dataset.index = index;
                optionsGrid.appendChild(btn);
                gameState.optionElements.push(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(gameState.timerInterval);
            gameState.timeLeft = timerConfig[gameState.difficulty];
            
            const timerDisplay = document.getElementById('timerDisplay');
            const timerProgress = document.getElementById('timerProgress');
            const maxTime = timerConfig[gameState.difficulty];

            timerProgress.style.width = '100%';
            timerDisplay.textContent = gameState.timeLeft;

            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft -= 0.1;
                timerDisplay.textContent = Math.ceil(gameState.timeLeft);
                timerProgress.style.width = `${(gameState.timeLeft / maxTime) * 100}%`;

                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timerInterval);
                    if (!gameState.isAnswered) {
                        timeUp();
                    }
                }
            }, 100);
        }

        function timeUp() {
            gameState.isAnswered = true;
            gameState.wrongCount++;
            gameState.combo = 0;

            const correctAnswer = gameState.questionType === 'author' ? gameState.currentPoem.author : gameState.currentPoem.title;
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correctAnswer) {
                    btn.classList.add('correct');
                }
            });

            showFeedback(false, correctAnswer);
            updateDisplay();
        }

        function selectAnswer(option, btnElement) {
            if (gameState.isAnswered) return;

            gameState.isAnswered = true;
            clearInterval(gameState.timerInterval);

            let correctAnswer;
            const qType = gameState.currentQuestionType;
            if (qType === 'fill') {
                correctAnswer = gameState.currentPoem.secondHalf;
            } else if (qType === 'author') {
                correctAnswer = gameState.currentPoem.author;
            } else {
                correctAnswer = gameState.currentPoem.title;
            }
            const isCorrect = option === correctAnswer;

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correctAnswer) {
                    btn.classList.add('correct');
                }
            });

            if (isCorrect) {
                gameState.correctCount++;
                gameState.combo++;
                if (gameState.combo > gameState.maxCombo) {
                    gameState.maxCombo = gameState.combo;
                }

                let points = 10;
                let bonusText = '';

                if (gameState.combo >= 3) {
                    points += 5;
                    bonusText = `+${points}分 (连击+5)`;
                } else {
                    bonusText = `+${points}分`;
                }

                const timeBonus = Math.floor(gameState.timeLeft * 2);
                points += timeBonus;
                gameState.timeBonus += timeBonus;
                gameState.score += points;

                const scoreDisplay = document.getElementById('scoreDisplay');
                scoreDisplay.classList.add('highlight');
                setTimeout(() => scoreDisplay.classList.remove('highlight'), 500);

                const bonusTextEl = document.getElementById('bonusText');
                bonusTextEl.textContent = bonusText + (timeBonus > 0 ? ` +${timeBonus}计时` : '');
                setTimeout(() => bonusTextEl.textContent = '', 2000);

                btnElement.classList.add('correct');
            } else {
                gameState.wrongCount++;
                gameState.combo = 0;
                btnElement.classList.add('wrong');
            }

            gameState.answered++;
            showFeedback(isCorrect, correctAnswer);
            updateDisplay();
        }

        function showFeedback(isCorrect, correctAnswer) {
            const feedback = document.getElementById('feedback');
            const feedbackText = document.getElementById('feedbackText');
            const feedbackDetail = document.getElementById('feedbackDetail');
            const nextBtn = document.getElementById('nextBtn');
            const qType = gameState.currentQuestionType;

            if (isCorrect) {
                feedback.className = 'feedback correct';
                feedbackText.textContent = '回答正确！';
                if (qType === 'fill') {
                    feedbackDetail.textContent = `完整诗句：${gameState.currentPoem.content}`;
                } else {
                    feedbackDetail.textContent = `恭喜你答对了！`;
                }
            } else {
                feedback.className = 'feedback wrong';
                feedbackText.textContent = '回答错误';
                if (qType === 'fill') {
                    feedbackDetail.innerHTML = `正确下句是：${correctAnswer}<br><span style="font-size:0.85em;color:#666;">完整诗句：${gameState.currentPoem.content}</span>`;
                } else {
                    feedbackDetail.textContent = `正确答案是：${correctAnswer}`;
                }
            }

            feedback.style.display = 'block';
            nextBtn.style.display = 'block';
            document.getElementById('favoriteBtn').style.display = 'block';
        }

        function nextQuestion() {
            loadQuestion();
        }

        function updateDisplay() {
            document.getElementById('scoreDisplay').textContent = gameState.score;
            document.getElementById('comboDisplay').textContent = gameState.combo;
            document.getElementById('answeredDisplay').textContent = gameState.answered;
            document.getElementById('remainingDisplay').textContent = gameState.totalQuestions - gameState.answered;
        }

        function endGame() {
            clearInterval(gameState.timerInterval);

            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('correctCount').textContent = gameState.correctCount;
            document.getElementById('wrongCount').textContent = gameState.wrongCount;
            document.getElementById('maxCombo').textContent = gameState.maxCombo;
            document.getElementById('timeBonus').textContent = gameState.timeBonus;

            saveToLeaderboard(gameState.score);

            showScreen('endScreen');
            renderEndLeaderboard();
        }

        function saveToLeaderboard(score) {
            let leaderboard = JSON.parse(localStorage.getItem('poemLeaderboard')) || [];
            leaderboard.push({
                score: score,
                date: new Date().toLocaleDateString(),
                difficulty: gameState.difficulty
            });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('poemLeaderboard', JSON.stringify(leaderboard));
        }

        function renderEndLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('poemLeaderboard')) || [];
            const container = document.getElementById('endLeaderboard');

            if (leaderboard.length === 0) {
                container.innerHTML = '<p class="empty-message">暂无记录</p>';
                return;
            }

            container.innerHTML = leaderboard.slice(0, 5).map((item, index) => `
                <div class="leaderboard-item">
                    <span class="leaderboard-rank">${index + 1}.</span>
                    <span>${item.score}分</span>
                    <span style="color: var(--border-brown); font-size: 0.85em;">${item.date}</span>
                </div>
            `).join('');
        }

        function showLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('poemLeaderboard')) || [];
            const container = document.getElementById('leaderboardContent');

            if (leaderboard.length === 0) {
                container.innerHTML = '<p class="empty-message">暂无记录</p>';
            } else {
                container.innerHTML = leaderboard.map((item, index) => `
                    <div class="leaderboard-item">
                        <span class="leaderboard-rank">${index + 1}.</span>
                        <span class="leaderboard-score">${item.score}分</span>
                        <span style="color: var(--border-brown);">${item.date}</span>
                    </div>
                `).join('');
            }

            showScreen('leaderboardScreen');
        }

        function addToFavorites() {
            if (!gameState.currentPoem) return;

            const poemKey = gameState.currentPoem.content;
            const exists = favorites.some(f => f.content === poemKey);

            if (exists) {
                favorites = favorites.filter(f => f.content !== poemKey);
                localStorage.setItem('poemFavorites', JSON.stringify(favorites));
                document.getElementById('favoriteBtn').textContent = '收藏此诗';
            } else {
                favorites.push({
                    content: gameState.currentPoem.content,
                    author: gameState.currentPoem.author,
                    title: gameState.currentPoem.title,
                    dynasty: gameState.currentPoem.dynasty
                });
                localStorage.setItem('poemFavorites', JSON.stringify(favorites));
                document.getElementById('favoriteBtn').textContent = '已收藏';
            }
        }

        function showFavorites() {
            const container = document.getElementById('favoritesList');

            if (favorites.length === 0) {
                container.innerHTML = '<p class="empty-message">暂无收藏的诗句</p>';
            } else {
                container.innerHTML = favorites.map((poem, index) => `
                    <div class="favorite-item">
                        <div class="favorite-poem">${poem.content}</div>
                        <div class="favorite-info">${poem.dynasty}·${poem.author}《${poem.title}》</div>
                        <div class="favorite-actions">
                            <button class="icon-btn" onclick="removeFavorite(${index})">删除</button>
                        </div>
                    </div>
                `).join('');
            }

            showScreen('favoritesScreen');
        }

        function removeFavorite(index) {
            favorites.splice(index, 1);
            localStorage.setItem('poemFavorites', JSON.stringify(favorites));
            showFavorites();
        }

        function restartGame() {
            startGame();
        }

        function goToStart() {
            showScreen('startScreen');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        window.onload = function() {
            updateDisplay();
        };
    </script>
</body>
</html>
