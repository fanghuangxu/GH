<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古典诗句问答</title>
        <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #3b82f6;
            --primary-dark: #1e40af;
            --secondary-blue: #60a5fa;
            --accent-cyan: #06b6d4;
            --success-green: #10b981;
            --danger-red: #ef4444;
            --warning-orange: #f59e0b;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--gray-900) 0%, var(--gray-800) 50%, var(--gray-700) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            min-height: 600px;
            position: relative;
        }

        .screen {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 40px;
            position: relative;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.6s ease-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scrollUnfold {
            from { max-height: 0; opacity: 0; }
            to { max-height: 500px; opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes correctFlash {
            0% { background-color: white; }
            50% { background-color: rgba(16, 185, 129, 0.1); }
            100% { background-color: white; }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        @keyframes scoreUp {
            0% { transform: scale(1); color: var(--gray-800); }
            50% { transform: scale(1.3); color: var(--success-green); }
            100% { transform: scale(1); color: var(--gray-800); }
        }

        .ornament-border, .corner-decoration {
            display: none;
        }

        h1 {
            text-align: center;
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5em;
            margin-bottom: 30px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        h2 {
            text-align: center;
            color: var(--gray-800);
            font-size: 1.8em;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: var(--gray-500);
            font-size: 1.1em;
            margin-bottom: 40px;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 15px auto;
            padding: 16px 32px;
            font-size: 1.1em;
            font-weight: 600;
            font-family: inherit;
            color: white;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-dark));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1), 0 2px 4px -1px rgba(59, 130, 246, 0.06);
        }

        .btn:hover {
            background: linear-gradient(135deg, var(--secondary-blue), var(--primary-blue));
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3), 0 4px 6px -2px rgba(59, 130, 246, 0.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--gray-600), var(--gray-700));
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, var(--gray-500), var(--gray-600));
        }

        .btn-small {
            padding: 10px 20px;
            font-size: 0.9em;
            max-width: 180px;
        }

        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 14px 28px;
            font-size: 1.0em;
            font-weight: 500;
            border: 2px solid var(--gray-300);
            background: white;
            color: var(--gray-700);
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 12px;
        }

        .difficulty-btn:hover {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
        }

        .difficulty-btn.selected {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-dark));
            color: white;
            border-color: var(--primary-blue);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 30px;
            padding: 24px;
            background: var(--gray-50);
            border-radius: 16px;
            border: 1px solid var(--gray-200);
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.85em;
            color: var(--gray-500);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .stat-value {
            font-size: 1.8em;
            color: var(--gray-800);
            font-weight: 700;
        }

        .stat-value.highlight {
            animation: scoreUp 0.5s ease;
        }

        .poem-scroll {
            background: linear-gradient(180deg, var(--gray-50) 0%, white 50%, var(--gray-50) 100%);
            border: 2px solid var(--gray-200);
            border-radius: 20px;
            padding: 40px;
            margin: 20px 0;
            position: relative;
            box-shadow: 
                0 10px 15px -3px rgba(0, 0, 0, 0.05),
                0 4px 6px -2px rgba(0, 0, 0, 0.05);
            animation: scrollUnfold 0.8s ease-out;
        }

        .poem-scroll::before,
        .poem-scroll::after {
            display: none;
        }

        .poem-content {
            font-size: 1.8em;
            text-align: center;
            color: var(--gray-800);
            line-height: 2;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .poem-question {
            text-align: center;
            font-size: 1.2em;
            color: var(--gray-600);
            margin-top: 20px;
            font-weight: 500;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 30px 0;
        }

        .option-btn {
            padding: 20px 16px;
            font-size: 1.1em;
            font-weight: 500;
            font-family: inherit;
            background: white;
            border: 2px solid var(--gray-300);
            color: var(--gray-700);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 12px;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success-green);
            color: var(--success-green);
            animation: pulse 0.5s ease;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.05);
            border-color: var(--gray-400);
            color: var(--gray-500);
            animation: wrongShake 0.5s ease;
        }

        .option-btn.key-selected {
            border-color: var(--primary-blue);
            background: rgba(59, 130, 246, 0.1);
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .btn.key-selected {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .timer-bar {
            height: 8px;
            background: var(--gray-200);
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }

        .timer-progress {
            height: 100%;
            background: linear-gradient(to right, var(--danger-red), var(--warning-orange));
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .timer-text {
            text-align: center;
            font-size: 1.1em;
            color: var(--gray-600);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .feedback {
            text-align: center;
            padding: 24px;
            border-radius: 16px;
            margin: 24px 0;
            animation: fadeIn 0.3s ease;
        }

        .feedback.correct {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.05));
            border: 2px solid var(--success-green);
        }

        .feedback.wrong {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
            border: 2px solid var(--danger-red);
        }

        .feedback-text {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .feedback.correct .feedback-text {
            color: var(--success-green);
        }

        .feedback.wrong .feedback-text {
            color: var(--danger-red);
        }

        .feedback-detail {
            font-size: 1.0em;
            color: var(--gray-600);
            margin-top: 8px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }

        .favorite-btn {
            background: linear-gradient(135deg, var(--warning-orange), #ea580c);
        }

        .favorite-btn:hover {
            background: linear-gradient(135deg, #fbbf24, var(--warning-orange));
        }

        .game-info {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: var(--gray-50);
            border-radius: 16px;
            border: 1px solid var(--gray-200);
        }

        .game-info h3 {
            font-size: 1.2em;
            color: var(--gray-700);
            margin-bottom: 16px;
        }

        .game-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .game-stat {
            text-align: center;
        }

        .game-stat-value {
            font-size: 2em;
            font-weight: 700;
            color: var(--primary-blue);
        }

        .game-stat-label {
            font-size: 0.9em;
            color: var(--gray-500);
            margin-top: 4px;
        }

        .leaderboard {
            background: var(--gray-50);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }

        .leaderboard h3 {
            font-size: 1.2em;
            color: var(--gray-700);
            margin-bottom: 16px;
            text-align: center;
        }

        .leaderboard-list {
            list-style: none;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--gray-200);
            transition: background 0.2s;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .leaderboard-item:hover {
            background: var(--gray-100);
        }

        .leaderboard-rank {
            font-weight: 700;
            color: var(--primary-blue);
            min-width: 40px;
        }

        .leaderboard-rank.gold { color: #fbbf24; }
        .leaderboard-rank.silver { color: #9ca3af; }
        .leaderboard-rank.bronze { color: #d97706; }

        .leaderboard-score {
            font-weight: 600;
            color: var(--gray-700);
        }

        .leaderboard-date {
            font-size: 0.85em;
            color: var(--gray-400);
        }

        .favorites-section {
            margin-top: 24px;
        }

        .favorites-section h3 {
            font-size: 1.2em;
            color: var(--gray-700);
            margin-bottom: 16px;
            text-align: center;
        }

        .favorites-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .favorite-item {
            padding: 16px;
            background: var(--gray-50);
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--gray-200);
            transition: all 0.3s;
        }

        .favorite-item:hover {
            border-color: var(--primary-blue);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1);
        }

        .favorite-content {
            font-size: 1.1em;
            color: var(--gray-800);
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .favorite-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: var(--gray-500);
        }

        .favorite-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
            gap: 8px;
        }

        .btn-icon {
            padding: 8px 16px;
            font-size: 0.9em;
            border-radius: 8px;
            max-width: none;
            width: auto;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: var(--gray-400);
            font-size: 1.1em;
        }

        .result-screen {
            text-align: center;
        }

        .result-screen h2 {
            font-size: 2em;
            margin-bottom: 30px;
        }

        .result-screen .btn {
            margin-top: 30px;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .screen {
                padding: 24px;
                border-radius: 16px;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
                padding: 16px;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            h2 {
                font-size: 1.5em;
            }

            .poem-content {
                font-size: 1.4em;
            }

            .game-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="screen active" id="startScreen">
            <div class="ornament-border top-left"></div>
            <div class="ornament-border bottom-right"></div>
            <div class="corner-decoration tl"></div>
            <div class="corner-decoration tr"></div>
            <div class="corner-decoration bl"></div>
            <div class="corner-decoration br"></div>

            <h1>古典诗句问答</h1>
            <p class="subtitle">诵千古诗词，传华夏文明</p>

            <div class="question-type-toggle">
                <button class="toggle-btn active" data-type="mixed" onclick="setQuestionType('mixed')">混合模式</button>
            </div>

            <div class="difficulty-selector">
                <button class="difficulty-btn" data-difficulty="easy" onclick="setDifficulty('easy')">简单</button>
                <button class="difficulty-btn selected" data-difficulty="medium" onclick="setDifficulty('medium')">中等</button>
                <button class="difficulty-btn" data-difficulty="hard" onclick="setDifficulty('hard')">困难</button>
            </div>

            <button class="btn" onclick="startGame()">开始答题</button>
            <button class="btn btn-secondary" onclick="showFavorites()">收藏诗句</button>
            <button class="btn btn-secondary btn-small" onclick="showLeaderboard()">排行榜</button>
        </div>

        <div class="screen" id="gameScreen">
            <div class="ornament-border top-left"></div>
            <div class="ornament-border bottom-right"></div>
            <div class="corner-decoration tl"></div>
            <div class="corner-decoration tr"></div>
            <div class="corner-decoration bl"></div>
            <div class="corner-decoration br"></div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-label">分数</div>
                    <div class="stat-value" id="scoreDisplay">0</div>
                    <div class="bonus-text" id="bonusText"></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">连击</div>
                    <div class="stat-value" id="comboDisplay">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">已答</div>
                    <div class="stat-value" id="answeredDisplay">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">剩余</div>
                    <div class="stat-value" id="remainingDisplay">20</div>
                </div>
            </div>

            <div class="timer-text">剩余时间: <span id="timerDisplay">15</span>秒</div>
            <div class="timer-bar">
                <div class="timer-progress" id="timerProgress"></div>
            </div>

            <div class="poem-scroll">
                <div class="poem-content" id="poemContent"></div>
                <div class="poem-question" id="poemQuestion"></div>
            </div>

            <div class="options-grid" id="optionsGrid"></div>

            <div class="feedback" id="feedback">
                <div id="feedbackText"></div>
                <div class="feedback-detail" id="feedbackDetail"></div>
            </div>

            <div class="game-controls">
                <button class="btn btn-secondary btn-small" onclick="addToFavorites()" id="favoriteBtn">收藏此诗</button>
                <button class="btn btn-small" onclick="nextQuestion()" id="nextBtn" style="display:none;">下一题 (Enter)</button>
            </div>
        </div>

        <div class="screen" id="endScreen">
            <div class="ornament-border top-left"></div>
            <div class="ornament-border bottom-right"></div>
            <div class="corner-decoration tl"></div>
            <div class="corner-decoration tr"></div>
            <div class="corner-decoration bl"></div>
            <div class="corner-decoration br"></div>

            <div class="result-screen">
                <h2>答题结束</h2>
                <div class="final-score" id="finalScore">0</div>
                <p style="text-align:center; color: var(--border-brown);">最终得分</p>

                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-stat-value" id="correctCount">0</div>
                        <div class="result-stat-label">答对</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="wrongCount">0</div>
                        <div class="result-stat-label">答错</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="maxCombo">0</div>
                        <div class="result-stat-label">最高连击</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-stat-value" id="timeBonus">0</div>
                        <div class="result-stat-label">计时奖励</div>
                    </div>
                </div>

                <div class="leaderboard">
                    <h3>最高分排行榜</h3>
                    <div id="endLeaderboard"></div>
                </div>

                <button class="btn" onclick="restartGame()">再来一局</button>
                <button class="btn btn-secondary" onclick="showFavorites()">查看收藏</button>
                <button class="btn btn-secondary btn-small" onclick="goToStart()">返回主页</button>
            </div>
        </div>

        <div class="screen" id="favoritesScreen">
            <div class="ornament-border top-left"></div>
            <div class="ornament-border bottom-right"></div>
            <div class="corner-decoration tl"></div>
            <div class="corner-decoration tr"></div>
            <div class="corner-decoration bl"></div>
            <div class="corner-decoration br"></div>

            <h2>收藏的诗句</h2>

            <div id="favoritesList">
                <p class="empty-message">暂无收藏的诗句</p>
            </div>

            <button class="btn btn-secondary" onclick="goToStart()">返回主页</button>
        </div>

        <div class="screen" id="leaderboardScreen">
            <div class="ornament-border top-left"></div>
            <div class="ornament-border bottom-right"></div>
            <div class="corner-decoration tl"></div>
            <div class="corner-decoration tr"></div>
            <div class="corner-decoration bl"></div>
            <div class="corner-decoration br"></div>

            <h2>最高分排行榜</h2>

            <div class="leaderboard" id="leaderboardList">
                <div id="leaderboardContent"></div>
            </div>

            <button class="btn btn-secondary" onclick="goToStart()">返回主页</button>
        </div>
    </div>

    <script>
        let poems = [
            // 苏轼 - 饮湖上初晴后雨
            { content: "水光潋滟晴方好，山色空蒙雨亦奇", firstHalf: "水光潋滟晴方好，", secondHalf: "山色空蒙雨亦奇", author: "苏轼", title: "饮湖上初晴后雨", dynasty: "宋" },
            { content: "欲把西湖比西子，淡妆浓抹总相宜", firstHalf: "欲把西湖比西子，", secondHalf: "淡妆浓抹总相宜", author: "苏轼", title: "饮湖上初晴后雨", dynasty: "宋" },
            
            // 苏轼 - 六月二十七日望湖楼醉书
            { content: "黑云翻墨未遮山，白雨跳珠乱入船", firstHalf: "黑云翻墨未遮山，", secondHalf: "白雨跳珠乱入船", author: "苏轼", title: "望湖楼醉书", dynasty: "宋" },
            { content: "卷地风来忽吹散，望湖楼下水如天", firstHalf: "卷地风来忽吹散，", secondHalf: "望湖楼下水如天", author: "苏轼", title: "望湖楼醉书", dynasty: "宋" },

        function handleKeyboard(event) {
            const activeScreen = document.querySelector('.screen.active');
            if (!activeScreen || activeScreen.id !== 'gameScreen') return;
            if (gameState.isAnswered) {
                if (event.key === 'Enter' && document.getElementById('nextBtn').style.display !== 'none') {

                return;

            const key = event.key;
            if (key >= '1' && key <= '9') {
                const index = parseInt(key) - 1;
                if (gameState.optionElements && gameState.optionElements[index]) {
                    const btn = gameState.optionElements[index];
                    btn.classList.add('key-selected');

        function loadQuestion() {
            if (gameState.answered >= gameState.totalQuestions) {
                endGame();
                return;
            }

            gameState.isAnswered = false;

            let currentQuestionType = gameState.questionType;
            if (currentQuestionType === 'mixed') {
                const randomVal = Math.random();
                if (randomVal < 0.9) {
                    // 90% 概率为杭州问答
                    currentQuestionType = 'quiz';
                } else {
                    // 10% 概率随机为其他三种题型
                    const otherTypes = ['author', 'title', 'fill'];
                    currentQuestionType = otherTypes[Math.floor(Math.random() * otherTypes.length)];
                }
            }
            gameState.currentQuestionType = currentQuestionType;

            const optionCount = difficultyOptions[gameState.difficulty];
            let questionText, correctAnswer, displayContent;

            if (currentQuestionType === 'quiz') {
                const availableQuiz = quizQuestions.filter(q => !gameState.answeredQuiz.includes(q.question));
                if (availableQuiz.length === 0) {
                    gameState.answeredQuiz = [];
                }
                const randomQuizIndex = Math.floor(Math.random() * (availableQuiz.length || quizQuestions.length));
                gameState.currentQuiz = availableQuiz.length > 0 ? availableQuiz[randomQuizIndex] : quizQuestions[randomQuizIndex];
                gameState.answeredQuiz.push(gameState.currentQuiz.question);
                
                questionText = gameState.currentQuiz.question;
                correctAnswer = gameState.currentQuiz.correctAnswer;
                displayContent = `【${gameState.currentQuiz.category}】`;
                
                const shuffledOptions = [...gameState.currentQuiz.options];
                shuffleArray(shuffledOptions);
                gameState.currentOptions = shuffledOptions.slice(0, optionCount);
                if (!gameState.currentOptions.includes(correctAnswer)) {
                    gameState.currentOptions[0] = correctAnswer;
                    shuffleArray(gameState.currentOptions);
                }
            } else {
                const availablePoems = poems.filter(p => !gameState.answeredPoems.includes(p.content));
                if (availablePoems.length === 0) {
                    gameState.answeredPoems = [];
                }
                const randomIndex = Math.floor(Math.random() * (availablePoems.length || poems.length));
                gameState.currentPoem = availablePoems.length > 0 ? availablePoems[randomIndex] : poems[randomIndex];
                gameState.answeredPoems.push(gameState.currentPoem.content);

                let optionPool;
                if (currentQuestionType === 'fill') {
                    questionText = '请填出下句：';
                    correctAnswer = gameState.currentPoem.secondHalf;
                    optionPool = fillOptions;
                    displayContent = gameState.currentPoem.firstHalf + '__________';
                } else if (currentQuestionType === 'author') {
                    questionText = '以上诗句的作者是？';
                    correctAnswer = gameState.currentPoem.author;
                    optionPool = authors;
                    displayContent = gameState.currentPoem.content;
                } else {
                    questionText = '以上诗句的题目是？';
                    correctAnswer = gameState.currentPoem.title;
                    optionPool = titles;
                    displayContent = gameState.currentPoem.content;
                }

                const optionsSet = new Set([correctAnswer]);
                while (optionsSet.size < optionCount) {
                    const randomOpt = optionPool[Math.floor(Math.random() * optionPool.length)];
                    if (randomOpt !== correctAnswer) {
                        optionsSet.add(randomOpt);
                    }
                }
                gameState.currentOptions = Array.from(optionsSet);
                shuffleArray(gameState.currentOptions);
            }

            const poemContent = document.getElementById('poemContent');
            const poemQuestion = document.getElementById('poemQuestion');
            const optionsGrid = document.getElementById('optionsGrid');
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            const favoriteBtn = document.getElementById('favoriteBtn');

            poemContent.textContent = displayContent;
            poemContent.style.animation = 'none';
            poemContent.offsetHeight;
            poemContent.style.animation = 'scrollUnfold 0.8s ease-out';

            poemQuestion.textContent = questionText;
            feedback.className = 'feedback';
            feedback.style.display = 'none';
            nextBtn.style.display = 'none';
            favoriteBtn.style.display = currentQuestionType === 'quiz' ? 'none' : 'block';

            optionsGrid.innerHTML = '';
            gameState.optionElements = [];
            gameState.currentOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = `${option} (数字${index + 1})`;
                btn.style.animationDelay = `${index * 0.1}s`;
                btn.onclick = () => selectAnswer(option, btn);
                btn.dataset.index = index;
                optionsGrid.appendChild(btn);
                gameState.optionElements.push(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(gameState.timerInterval);
            gameState.timeLeft = timerConfig[gameState.difficulty];
            
            const timerDisplay = document.getElementById('timerDisplay');
            const timerProgress = document.getElementById('timerProgress');
            const maxTime = timerConfig[gameState.difficulty];

            timerProgress.style.width = '100%';
            timerDisplay.textContent = gameState.timeLeft;

            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft -= 0.1;
                timerDisplay.textContent = Math.ceil(gameState.timeLeft);
                timerProgress.style.width = `${(gameState.timeLeft / maxTime) * 100}%`;

                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timerInterval);
                    if (!gameState.isAnswered) {
                        timeUp();
                    }
                }
            }, 100);

        function timeUp() {
            gameState.isAnswered = true;
            gameState.wrongCount++;
            gameState.combo = 0;

            const correctAnswer = gameState.questionType === 'author' ? gameState.currentPoem.author : gameState.currentPoem.title;
            
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correctAnswer) {
                    btn.classList.add('correct');
                }
            });

            showFeedback(false, correctAnswer);
            updateDisplay();
        }

        function selectAnswer(option, btnElement) {
            if (gameState.isAnswered) return;

            gameState.isAnswered = true;
            clearInterval(gameState.timerInterval);

            let correctAnswer;
            const qType = gameState.currentQuestionType;
            if (qType === 'quiz') {
                correctAnswer = gameState.currentQuiz.correctAnswer;
            } else if (qType === 'fill') {
                correctAnswer = gameState.currentPoem.secondHalf;
            } else if (qType === 'author') {
                correctAnswer = gameState.currentPoem.author;
            } else {
                correctAnswer = gameState.currentPoem.title;
            }
            const isCorrect = option === correctAnswer;

            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.disabled = true;
                const btnAnswer = btn.textContent.split(' (数字')[0];
                if (btnAnswer === correctAnswer) {
                    btn.classList.add('correct');
                }
            });

            if (isCorrect) {
                gameState.correctCount++;
                gameState.combo++;
                if (gameState.combo > gameState.maxCombo) {
                    gameState.maxCombo = gameState.combo;
                }

                let points = 10;
                let bonusText = '';

                if (gameState.combo >= 3) {
                    points += 5;
                    bonusText = `+${points}分 (连击+5)`;
                } else {
                    bonusText = `+${points}分`;
                }

                const timeBonus = Math.floor(gameState.timeLeft * 2);
                points += timeBonus;
                gameState.timeBonus += timeBonus;
                gameState.score += points;

                const scoreDisplay = document.getElementById('scoreDisplay');
                scoreDisplay.classList.add('highlight');
                setTimeout(() => scoreDisplay.classList.remove('highlight'), 500);

                const bonusTextEl = document.getElementById('bonusText');
                bonusTextEl.textContent = bonusText + (timeBonus > 0 ? ` +${timeBonus}计时` : '');
                setTimeout(() => bonusTextEl.textContent = '', 2000);

                btnElement.classList.add('correct');
            } else {
                gameState.wrongCount++;
                gameState.combo = 0;
                btnElement.classList.add('wrong');
            }

            gameState.answered++;
            showFeedback(isCorrect, correctAnswer);
            updateDisplay();
        }

        function showFeedback(isCorrect, correctAnswer) {
            const feedback = document.getElementById('feedback');
            const feedbackText = document.getElementById('feedbackText');
            const feedbackDetail = document.getElementById('feedbackDetail');
            const nextBtn = document.getElementById('nextBtn');
            const qType = gameState.currentQuestionType;

            if (isCorrect) {
                feedback.className = 'feedback correct';
                feedbackText.textContent = '回答正确！';
                if (qType === 'fill') {
                    feedbackDetail.textContent = `完整诗句：${gameState.currentPoem.content}`;
                } else if (qType === 'quiz') {
                    feedbackDetail.textContent = `恭喜你答对了！`;
                } else {
                    feedbackDetail.textContent = `恭喜你答对了！`;
                }
            } else {
                feedback.className = 'feedback wrong';
                feedbackText.textContent = '回答错误';
                if (qType === 'fill') {
                    feedbackDetail.innerHTML = `正确下句是：${correctAnswer}<br><span style="font-size:0.85em;color:#666;">完整诗句：${gameState.currentPoem.content}</span>`;
                } else if (qType === 'quiz') {
                    feedbackDetail.textContent = `正确答案是：${correctAnswer}`;
                } else {
                    feedbackDetail.textContent = `正确答案是：${correctAnswer}`;
                }
            }

            feedback.style.display = 'block';
            nextBtn.style.display = 'block';
            if (qType !== 'quiz') {
                document.getElementById('favoriteBtn').style.display = 'block';
            }
        }

        function nextQuestion() {
            loadQuestion();
        }

        function updateDisplay() {
            document.getElementById('scoreDisplay').textContent = gameState.score;
            document.getElementById('comboDisplay').textContent = gameState.combo;
            document.getElementById('answeredDisplay').textContent = gameState.answered;
            document.getElementById('remainingDisplay').textContent = gameState.totalQuestions - gameState.answered;
        }

        function endGame() {
            clearInterval(gameState.timerInterval);

            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('correctCount').textContent = gameState.correctCount;
            document.getElementById('wrongCount').textContent = gameState.wrongCount;
            document.getElementById('maxCombo').textContent = gameState.maxCombo;
            document.getElementById('timeBonus').textContent = gameState.timeBonus;

            saveToLeaderboard(gameState.score);

            showScreen('endScreen');
            renderEndLeaderboard();
        }

        function saveToLeaderboard(score) {
            let leaderboard = JSON.parse(localStorage.getItem('poemLeaderboard')) || [];
            leaderboard.push({
                score: score,
                date: new Date().toLocaleDateString(),
                difficulty: gameState.difficulty
            });
            leaderboard.sort((a, b) => b.score - a.score);
            leaderboard = leaderboard.slice(0, 10);
            localStorage.setItem('poemLeaderboard', JSON.stringify(leaderboard));
        }

        function renderEndLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('poemLeaderboard')) || [];
            const container = document.getElementById('endLeaderboard');

            if (leaderboard.length === 0) {
                container.innerHTML = '<p class="empty-message">暂无记录</p>';
                return;
            }

            container.innerHTML = leaderboard.slice(0, 5).map((item, index) => `
                <div class="leaderboard-item">
                    <span class="leaderboard-rank">${index + 1}.</span>
                    <span>${item.score}分</span>
                    <span style="color: var(--border-brown); font-size: 0.85em;">${item.date}</span>
                </div>
            `).join('');
        }

        function showLeaderboard() {
            const leaderboard = JSON.parse(localStorage.getItem('poemLeaderboard')) || [];
            const container = document.getElementById('leaderboardContent');

            if (leaderboard.length === 0) {
                container.innerHTML = '<p class="empty-message">暂无记录</p>';
            } else {
                container.innerHTML = leaderboard.map((item, index) => `
                    <div class="leaderboard-item">
                        <span class="leaderboard-rank">${index + 1}.</span>
                        <span class="leaderboard-score">${item.score}分</span>
                        <span style="color: var(--border-brown);">${item.date}</span>
                    </div>
                `).join('');
            }

            showScreen('leaderboardScreen');
        }

        function addToFavorites() {
            if (!gameState.currentPoem) return;

            const poemKey = gameState.currentPoem.content;
            const exists = favorites.some(f => f.content === poemKey);

            if (exists) {
                favorites = favorites.filter(f => f.content !== poemKey);
                localStorage.setItem('poemFavorites', JSON.stringify(favorites));
                document.getElementById('favoriteBtn').textContent = '收藏此诗';
            } else {
                favorites.push({
                    content: gameState.currentPoem.content,
                    author: gameState.currentPoem.author,
                    title: gameState.currentPoem.title,
                    dynasty: gameState.currentPoem.dynasty
                });
                localStorage.setItem('poemFavorites', JSON.stringify(favorites));
                document.getElementById('favoriteBtn').textContent = '已收藏';
            }
        }

        function showFavorites() {
            const container = document.getElementById('favoritesList');

            if (favorites.length === 0) {
                container.innerHTML = '<p class="empty-message">暂无收藏的诗句</p>';
            } else {
                container.innerHTML = favorites.map((poem, index) => `
                    <div class="favorite-item">
                        <div class="favorite-poem">${poem.content}</div>
                        <div class="favorite-info">${poem.dynasty}·${poem.author}《${poem.title}》</div>
                        <div class="favorite-actions">
                            <button class="icon-btn" onclick="removeFavorite(${index})">删除</button>
                        </div>
                    </div>
                `).join('');
            }

            showScreen('favoritesScreen');
        }

        function removeFavorite(index) {
            favorites.splice(index, 1);
            localStorage.setItem('poemFavorites', JSON.stringify(favorites));
            showFavorites();
        }

        function restartGame() {
            startGame();
        }

        function goToStart() {
            showScreen('startScreen');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        window.onload = function() {
            updateDisplay();
        };
    </script>
</body>
</html>
